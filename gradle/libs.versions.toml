[versions]
# libraries
gradleToolingApi = "9.5.0"
junit = "4.13.2"
kotlinxCoroutines = "1.9.0"
kotlinxSerializationJson = "1.8.1"
opentest4j = "1.3.0"
slf4j = "2.0.17"

# plugins
changelog = "2.5.0"
intelliJPlatform = "2.16.0"
kotlin = "2.1.21"
kover = "0.9.7"
pluginPublish = "2.0.0"
qodana = "2025.3.2"

[libraries]
gradleToolingApi = { group = "org.gradle", name = "gradle-tooling-api", version.ref = "gradleToolingApi" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinxCoroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinxSerializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
opentest4j = { group = "org.opentest4j", name = "opentest4j", version.ref = "opentest4j" }
slf4jSimple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinBase = { id = "kotlin-base" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
pluginPublish = { id = "com.gradle.plugin-publish", version.ref = "pluginPublish" }
qodana = { id = "org.jetbrains.qodana", version.ref = "qodana" }
