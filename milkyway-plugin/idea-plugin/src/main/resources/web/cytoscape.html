<!doctype html>
<html lang="en">
<head>
    <title>MilkyWay</title>
    <meta charset="utf-8">
    <style>
        {{MILKYWAY_CSS}}
    </style>
</head>
<body>
<div id="toolbar">
    <button onclick="resetGraph()">Reset</button>
    <button onclick="addCompound()">Compound</button>
    <button onclick="collapseSelected()">Collapse</button>
    <button onclick="expandSelected()">Expand</button>
    <button onclick="collapseEdgesBetweenNodes()">Collapse edges between nodes</button>
    <button onclick="expandEdgesBetweenNodes()">Expand edges between nodes</button>
    <button onclick="mcollapseAllNodes()">Collapse all nodes</button>
    <button onclick="mcollapseAllEdges()">Collapse all edges</button>
    <button onclick="applyKlayLayout(15)">Klay layout</button>

    <button class="iconButton" title="Rotate left 90°" onclick="rotateGraph(-90)">↺</button>
    <button class="iconButton" title="Rotate right 90°" onclick="rotateGraph(90)">↻</button>

    <label class="toolbarGroup">
        <input id="criticalPathCheckbox" type="checkbox" onchange="applyCriticalPathVisibility()">
        <span>Show critical path</span>
    </label>

    <label class="toolbarGroup">
        <input id="groupCheckbox" type="checkbox" onchange="applyGroupVisibility()">
        <span>Show groups</span>
    </label>

    <label class="toolbarGroup">
        <input id="nodeLabelCheckbox" type="checkbox" onchange="applyNodeLabelVisibility()">
        <span>Show node labels</span>
    </label>

    <label class="toolbarGroup">
        <input id="edgeLabelCheckbox" type="checkbox" onchange="applyEdgeVisibility()">
        <span>Show edge labels</span>
    </label>

    <label class="toolbarGroup">
        <input id="articulationPointsCheckbox" type="checkbox" onchange="applyArticulationPointVisibility()">
        <span>Show articulation points</span>
    </label>

</div>

<div id="legend">
    <div id="legendHeader" onclick="toggleLegend()">
        <span>Graph summary</span>
        <button id="legendToggle" type="button">+</button>
    </div>

    <div id="legendBody" style="display: none;">
        <div class="legendRow">
            <span class="legendLabel">Nodes</span>
            <span class="legendValue" id="nodeCount">–</span>
        </div>

        <div class="legendRow">
            <span class="legendLabel">Edges</span>
            <span class="legendValue" id="edgeCount">–</span>
        </div>

        <div class="legendRow">
            <span class="legendLabel">Critical path length</span>
            <span class="legendValue" id="criticalPathLength">–</span>
        </div>

        <div class="legendMarkerRow">
            <span class="marker markerRegular"></span>
            <span>Regular module</span>
        </div>

        <div class="legendMarkerRow">
            <span class="marker markerCritical"></span>
            <span>Critical path module</span>
        </div>
        <div class="legendMarkerRow">
            <span class="marker markerArticulationPoint"></span>
            <span>Articulation point module</span>
        </div>
    </div>


    <div id="legendShapeHeader" onclick="toggleShapeLegend()">
        <span>Shape similarities</span>
        <button id="legendShapeToggle" type="button">+</button>
    </div>
    <div id="shapeSimilarityLegendBody" style="display: none;"></div>
</div>

<div id="performance">
    <div class="metric-block" id="renderMetrics" aria-label="Render time">
        Render: <span id="renderTime">–</span> ms
    </div>
    <div class="metric-block" id="fpsMetrics" aria-label="FPS">
        <span id="fpsCount">-</span> FPS
    </div>
</div>
<div id="zoom-panel" aria-label="Zoom Panel">
    <div class="zoom-btn zoom-in" onclick="zoomIn(1.2)">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-zoom-in" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M6.5 12a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11M13 6.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0"/>
            <path d="M10.344 11.742q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1 6.5 6.5 0 0 1-1.398 1.4z"/>
            <path fill-rule="evenodd" d="M6.5 3a.5.5 0 0 1 .5.5V6h2.5a.5.5 0 0 1 0 1H7v2.5a.5.5 0 0 1-1 0V7H3.5a.5.5 0 0 1 0-1H6V3.5a.5.5 0 0 1 .5-.5"/>
        </svg>
    </div>
    <div class="zoom-btn zoom-out" onclick="zoomOut(1.2)">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-zoom-out" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M6.5 12a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11M13 6.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0"/>
            <path d="M10.344 11.742q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1 6.5 6.5 0 0 1-1.398 1.4z"/>
            <path fill-rule="evenodd" d="M3 6.5a.5.5 0 0 1 .5-.5h6a.5.5 0 0 1 0 1h-6a.5.5 0 0 1-.5-.5"/>
        </svg>
    </div>
    <div class="zoom-btn fit-graph" onclick="fitGraph()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrows-fullscreen" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M5.828 10.172a.5.5 0 0 0-.707 0l-4.096 4.096V11.5a.5.5 0 0 0-1 0v3.975a.5.5 0 0 0 .5.5H4.5a.5.5 0 0 0 0-1H1.732l4.096-4.096a.5.5 0 0 0 0-.707m4.344 0a.5.5 0 0 1 .707 0l4.096 4.096V11.5a.5.5 0 1 1 1 0v3.975a.5.5 0 0 1-.5.5H11.5a.5.5 0 0 1 0-1h2.768l-4.096-4.096a.5.5 0 0 1 0-.707m0-4.344a.5.5 0 0 0 .707 0l4.096-4.096V4.5a.5.5 0 1 0 1 0V.525a.5.5 0 0 0-.5-.5H11.5a.5.5 0 0 0 0 1h2.768l-4.096 4.096a.5.5 0 0 0 0 .707m-4.344 0a.5.5 0 0 1-.707 0L1.025 1.732V4.5a.5.5 0 0 1-1 0V.525a.5.5 0 0 1 .5-.5H4.5a.5.5 0 0 1 0 1H1.732l4.096 4.096a.5.5 0 0 1 0 .707"/>
        </svg>
    </div>
</div>

<div id="cy"></div>
<div id="groupOverlay"></div>
<div id="nodeLabelOverlay"></div>
<div id="edgeLabelOverlay"></div>

<script>
    {{CYTOSCAPE_JS}}
</script>
<script>
    {{KLAY}}
</script>
<script>
    {{CYTOSCAPE_KLAY}}
</script>
<script>
    {{CYTOSCAPE_EXPAND_COLLAPSE_JS}}
</script>
<script>
    {{CYTOSCAPE_UNDO_REDO_JS}}
</script>

<script>
    window.__MILKYWAY_REPORT__ = {{MILKYWAY_REPORT_JSON}};
</script>

<script>
    {{MILKYWAY_VIEW_JS}}
</script>
</body>
</html>
