name: Build Milkyway Plugin

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'jetbrains'
      - name: Build IDEA plugin
        id: artifact
        run: |
          cd milkyway-plugin
          chmod +x gradlew
          ./gradlew :idea-plugin:buildPlugin --no-configuration-cache
